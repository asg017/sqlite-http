name: "Release"
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build-extension:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-aarch64
          # last Intel macOS image, supported until August 2027
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-14
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make loadable
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.so
            dist/*.dylib
            dist/*.dll
  dist:
    runs-on: ubuntu-latest
    needs: [build-extension]
    steps:
      - uses: actions/checkout@v4
      # each artifact lands in dist/<target>/http0.<ext>, the layout sqlite-dist expects
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - uses: asg017/setup-sqlite-dist@fadb0183a6ec70c3f1942de7d232b087ff2bacd1
      - run: sqlite-dist build --set-version $(cat VERSION)
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-dist-output
          path: .sqlite-dist/
          include-hidden-files: true
  publish-github-release:
    runs-on: ubuntu-latest
    needs: dist
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sqlite-dist-output
          path: .sqlite-dist/
      - run: |
          gh release upload ${{ github.ref_name }} \
            .sqlite-dist/github_releases/* \
            .sqlite-dist/spm/* \
            .sqlite-dist/sqlpkg/* \
            .sqlite-dist/checksums.txt \
            .sqlite-dist/sqlite-dist-manifest.json \
            .sqlite-dist/install.sh
        env:
          GH_TOKEN: ${{ github.token }}
  # npm trusted publishing: no stored token. npm verifies the GitHub OIDC
  # token against the trusted publisher configured on each package
  # (repo asg017/sqlite-http, workflow release.yaml, environment release).
  publish-npm:
    runs-on: ubuntu-latest
    needs: dist
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sqlite-dist-output
          path: .sqlite-dist/
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: |
          VERSION=$(cat VERSION)
          if echo "$VERSION" | grep -q "alpha"; then
            TAG=alpha
          elif echo "$VERSION" | grep -q "beta"; then
            TAG=beta
          else
            TAG=latest
          fi
          npm publish --access public --tag $TAG .sqlite-dist/npm/sqlite-http-darwin-arm64.tar.gz
          npm publish --access public --tag $TAG .sqlite-dist/npm/sqlite-http-darwin-x64.tar.gz
          npm publish --access public --tag $TAG .sqlite-dist/npm/sqlite-http-linux-x64.tar.gz
          npm publish --access public --tag $TAG .sqlite-dist/npm/sqlite-http-linux-arm64.tar.gz
          npm publish --access public --tag $TAG .sqlite-dist/npm/sqlite-http-windows-x64.tar.gz
          npm publish --access public --tag $TAG .sqlite-dist/npm/sqlite-http.tar.gz
  publish-gem:
    runs-on: ubuntu-latest
    needs: dist
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sqlite-dist-output
          path: .sqlite-dist/
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
      - run: |
          for file in .sqlite-dist/gem/*; do
            gem push "$file"
          done
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}
  publish-pypi:
    runs-on: ubuntu-latest
    needs: dist
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sqlite-dist-output
          path: .sqlite-dist/
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv publish .sqlite-dist/pip/*
          uv publish .sqlite-dist/datasette/*
          uv publish .sqlite-dist/sqlite_utils/*
        env:
          UV_PUBLISH_USERNAME: __token__
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
