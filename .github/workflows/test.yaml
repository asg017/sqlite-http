name: "Test"
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  build-extension:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-aarch64
          # last Intel macOS image, supported until August 2027
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-14
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make loadable
      # Run the test suite against a local httpbin so the network paths are
      # actually exercised. go-httpbin is a Go binary, so it runs on every
      # runner in the matrix without Docker.
      - name: Test against a local httpbin
        shell: bash
        run: |
          go run github.com/mccutchen/go-httpbin/v2/cmd/go-httpbin@v2.25.0 -port 8080 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/get > /dev/null && break
            sleep 1
          done
          make test-loadable
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-http-${{ matrix.target }}-extension
          path: |
            dist/*.so
            dist/*.dylib
            dist/*.dll
